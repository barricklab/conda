{% set name = "centrifuge" %}
{% set version = "1.0.4.2" %}

# macOS build of Centrifuge. Derived from the bioconda recipe (which skips osx); Linux users get
# Centrifuge from bioconda.

package:
  name: {{ name|lower }}
  version: {{ version }}

build:
  number: 0
  skip: true  # [not osx]
  run_exports:
    - {{ pin_subpackage("centrifuge", max_pin="x.x") }}

source:
  url: https://github.com/DaehwanKimLab/centrifuge/archive/refs/tags/v{{ version }}.tar.gz
  sha256: db142790522a72971c7deda7d22e1f29fce54dbf23afc2e40def9f5a764f4c99
  patches:
    # bioconda's linux-aarch64 patch, extended to Apple Silicon (uname -m = arm64), plus the
    # Makefile reading VERSION.txt (build.sh renames VERSION, see there).
    - centrifuge-arm64.patch

requirements:
  build:
    - make
    - {{ compiler('cxx') }}
  host:
    - zlib
  run:
    - zlib
    - perl
    - wget
    - tar
    - python

test:
  commands:
    - centrifuge --help
    - centrifuge-build --help > /dev/null
    - centrifuge-inspect --help > /dev/null

about:
  home: https://github.com/DaehwanKimLab/centrifuge
  license: GPL-3.0-only
  license_file: LICENSE
  license_family: GPL3
  summary: 'Classifier for metagenomic sequences. Supports classifier scripts'

extra:
  identifiers:
    - biotools:Centrifuge
    - doi:10.1101/gr.210641.116
