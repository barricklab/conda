{# Both set by CI from scripts/derive_version.sh; the defaults are for local builds only. #}
{% set version = environ.get("CNERY_VERSION", "0.0.0.dev0+local") %}
{% set build_string = environ.get("CNERY_BUILD_STRING", "local") %}

package:
  name: cnery-prerelease
  version: {{ version }}

source:
  git_url: https://github.com/barricklab/CNery.git
  git_rev: {{ environ.get("CNERY_COMMIT_SHA", "HEAD") }}
  git_depth: -1

build:
  number: 0
  string: {{ build_string }}
  noarch: python
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation -v .
  script_env:
    - CNERY_COMMIT_SHA

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=68.2.0
  run:
    - python >=3.9
    - pandas >=2.2.0,<3
    - numpy >=1.26.0
    - matplotlib >=3.8.0
    - statsmodels >=0.14.0
    - scipy >=1.12.0
    - seaborn >=0.13.0

test:
  commands:
    - CNery --help

about:
  home: https://github.com/barricklab/CNery
  license: MIT
  license_family: MIT
  summary: "Automated pre-release build of CNery tracking barricklab/CNery's main branch (not for production use)."
