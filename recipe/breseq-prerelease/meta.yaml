{# Both set by CI from scripts/derive_version.sh; the defaults are for local builds only. #}
{% set version = environ.get("BRESEQ_VERSION", "0.0.0.dev0+local") %}
{% set build_string = environ.get("BRESEQ_BUILD_STRING", "local") %}
{# Bump when this recipe changes without the upstream commit changing -- a dependency pin, say.
   Version and build_string both derive from the upstream SHA, so without this in the build
   string a recipe-only rebuild would produce a filename already in the channel, and
   publish_channel.sh would decline to overwrite it. #}
{% set build_number = 2 %}

package:
  name: breseq-prerelease
  version: {{ version }}

source:
  git_url: https://github.com/barricklab/breseq.git
  git_rev: {{ environ.get("BRESEQ_COMMIT_SHA", "HEAD") }}
  git_depth: -1

build:
  number: {{ build_number }}
  string: {{ build_string }}_{{ build_number }}
  script_env:
    - BRESEQ_COMMIT_SHA

requirements:
  build:
    - {{ compiler('cxx') }}
    - sysroot_linux-64 2.17      # [linux64]
    - sysroot_linux-aarch64 2.17  # [aarch64]    
    - autoconf
    - automake
    - libtool
    - pkg-config
    - m4
    - make
  host:
    - __glibc >=2.17  # [linux]
    - zlib 1.3.2.*
    - miniz 3.1.1.*
    - htslib 1.24.*
  run:
    - htslib 1.24.*
    - samtools 1.24.*
    - bowtie2 2.5.5.*
    - gnuplot 6.0.4.*
    - phylip 3.697.*
    - cnery-prerelease >=0.1.0.dev127

test:
  commands:
    - breseq --help 2>&1 | grep Usage
    - gdtools --help 2>&1 | grep Usage

about:
  home: https://github.com/barricklab/breseq
  license: GPL-2.0-or-later
  license_family: GPL3
  summary: "Automated pre-release build of breseq tracking barricklab/breseq's master branch (not for production use; see the breseq bioconda package for stable releases)."
